[project]
name = "stdm"
version = "0.1.0"
description = "Sparse Tensor Decomposition for Multi-species gene expression data"
readme = "README.md"
authors = [
    { name = "copilot-swe-agent[bot]", email = "198982749+Copilot@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "tensorly>=0.8.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
stdm = "stdm.cli:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
